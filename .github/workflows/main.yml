name: Techie Tenka API CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SHARED_SERVICE_PATHS: "services/shared-service/"
  LIB_PATHS: "lib/"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  next_version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.pr.outputs.version }}
      sha: ${{ steps.pr.outputs.sha }}
      bumped: ${{ steps.pr.outputs.bumped }}
    steps:
      - name: Checkout PR head branch (dev)
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz
        run: cargo install release-plz --locked

      - name: Bump version
        run: release-plz update

      - name: Merge bump into dev and output version
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          V=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="lib") | .version')
          if [[ -z "$V" ]]; then
            echo "Failed to determine version."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          git add -A
          if git diff --cached --quiet; then
            echo "No version bump needed."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="release/v${V}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "chore: release v${V}"
          git push --force origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$HEAD_REF" \
            --head "$BRANCH" \
            --title "chore: release v${V}" \
            --body "Automated version bump generated by release-plz."

          # [skip ci] stops the dev -> main PR from starting a second run.
          gh pr merge "$BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --subject "chore: release v${V} [skip ci]" \
            --delete-branch

          sha=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json mergeCommit -q .mergeCommit.oid)
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  check_shared_service_changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [next_version]
    outputs:
      workspace_version: ${{ needs.next_version.outputs.version }}
      shared_service_should_deploy: ${{ steps.confirm_changes.outputs.SHARED_SERVICE_SHOULD_DEPLOY }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - id: confirm_changes
        name: Detect changed services
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            push)         BASE="$PUSH_BEFORE" ;;
            *)            BASE="" ;;
          esac
          HEAD="$GITHUB_SHA"

          # No usable base (manual run, first push, force-push): deploy rather than skip.
          DEPLOY_ALL=false
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit for event '$EVENT_NAME'; deploying."
            DEPLOY_ALL=true
            changed=""
          else
            echo "Base SHA: $BASE"
            echo "Head SHA: $HEAD"
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi

          echo "Changed files:"
          echo "$changed"

          path_changed() {
            grep -q "^$1" <<< "$changed"
          }

          if [[ "$DEPLOY_ALL" == "true" ]] \
             || path_changed "$LIB_PATHS" \
             || path_changed "$SHARED_SERVICE_PATHS" \
             || path_changed "Cargo.toml" \
             || path_changed "Cargo.lock"; then
            echo "SHARED_SERVICE_SHOULD_DEPLOY=true" >> "$GITHUB_OUTPUT"
          else
            echo "SHARED_SERVICE_SHOULD_DEPLOY=false" >> "$GITHUB_OUTPUT"
          fi

          cat "$GITHUB_OUTPUT"

  build_and_deploy_shared_service:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    needs: [check_shared_service_changes]
    if: ${{ needs.check_shared_service_changes.outputs.shared_service_should_deploy == 'true' }}

    permissions:
      id-token: write # required to use OIDC authentication
      contents: read # required to checkout the code from the repo

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "SHARED_REGISTRY_IMAGE=registry.techietenka.com/shared-service" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SHARED_REGISTRY_IMAGE }}

      - uses: useblacksmith/checkout@v1

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.techietenka.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Docker image
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          # context: .
          # push: true
          tags: ${{ env.SHARED_REGISTRY_IMAGE }}
          build-args: |
            SERVICE_NAME=shared-service
            PORT=3002
          platforms: ${{ matrix.platform }}
          provenance: true # enables --provenance=mode=max
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-shared-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-shared-*
          merge-multiple: true

      - name: Docker meta
        id: meta-tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SHARED_REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.check_shared_service_changes.outputs.workspace_version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.SHARED_REGISTRY_IMAGE }}@sha256:%s ' *)

  deploy_to_server:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build_and_deploy_shared_service]
    if: |
      always() && needs.build_and_deploy_shared_service.result != 'failure'

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy manifests and configs
        run: |
          cat > k3s/manifests/ipallowlist.yaml <<'EOF'
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: surrealist-ipallowlist
                namespace: techietenka
              spec:
                ipAllowList:
                  sourceRange:
                    - ${{ secrets.ALLOWED_IP_MY_MAC }}
                    - ${{ secrets.ALLOWED_IP_MY_MAC_IPV6 }}
                    - ${{ secrets.ALLOWED_IP_K3S }}
                  ipStrategy:
                    ipv6Subnet: 64
          EOF

          scp -r k3s ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/
          scp -r mosquitto ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/

      - name: Deploy on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'EOF'
                set -e

                cd /home/${{ secrets.VM_USER }}

                # Make .sh scripts executable
                chmod +x k3s/configs.sh

                # Run script(s)
                ./k3s/configs.sh

                # Apply manifests after scripts (if needed)
                kubectl apply -f ./k3s/manifests -R
          EOF

  automerge:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    needs: [build_and_deploy_shared_service, deploy_to_server]
    if: |
      always() &&
      needs.build_and_deploy_shared_service.result != 'failure' &&
      needs.build_and_deploy_shared_service.result != 'cancelled' &&
      needs.deploy_to_server.result != 'failure' &&
      needs.deploy_to_server.result != 'cancelled'
    steps:
      - id: automerge
        name: automerge
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          MERGE_METHOD: merge
          MERGE_LABELS: ""
          MERGE_RETRIES: "10"
          MERGE_RETRY_SLEEP: "10000"

  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    needs: [next_version, automerge]
    if: |
      always() &&
      needs.next_version.result == 'success' &&
      needs.automerge.result == 'success'
    env:
      TAG: v${{ needs.next_version.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Tag source repository
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target main \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Released ${TAG}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
