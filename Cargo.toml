[workspace]
resolver = "3"
members = [
    # Libs
    "lib",
    # Services
    "services/shared-service",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Elon Aseneka Idiong'o"]
license-file = "./LICENSE"

[workspace.dependencies]
# Web / HTTP
axum = "0.8.9"
hyper = "1.12.0"
tower-http = { version = "0.7.1", features = ["cors"] }
tower_governor = "=0.8.0"
reqwest = { version = "0.13.5", features = ["json"] }

# Async runtime
tokio = { version = "1.53.2", features = ["full"] }
async-trait = "0.1.92"

# GraphQL
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"

# gRPC / Protobuf
tonic = "0.14.6"
tonic-build = "0.14.6"
tonic-middleware = "0.4.1"
prost = "0.14.4"
tonic-prost-build = "0.14.6"
tonic-prost = "0.14.6"

# Database
surrealdb = "3.3.1"

# Serialization
serde = "1.0.229"

# Tracing / Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
cookie = "0.18.2"
uuid = "1.27.0"
markdown = "1.0.0"
scraper = "0.27.0"
syntect = "5.3.0"
html2text = "0.17.1"
anyhow = "1.0.104"

# Internal
lib = { path = "lib" }

[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
